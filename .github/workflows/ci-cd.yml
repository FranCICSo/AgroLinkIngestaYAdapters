name: AgroLink Ingesta CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      deploy_simulador:
        description: "Tambien construir y levantar simulador-viajes en la VM (herramienta de demo/dev, nunca automatico en un push normal)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RINHO_RECEPTOR_IMAGE_NAME: ${{ github.repository }}-rinho-receptor
  SIMULADOR_VIAJES_IMAGE_NAME: ${{ github.repository }}-simulador-viajes

concurrency:
  group: deploy-agrolink-stack
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI: Ejecución de Tests y Verificación de Compilación
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Pruebas con Maven
        run: mvn clean test -B

  test-simulador:
    name: Unit Tests (simulador-viajes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: simulador-viajes/package-lock.json

      - name: Instalar dependencias
        working-directory: simulador-viajes
        run: npm ci

      - name: Ejecutar tests unitarios (simulador-viajes)
        working-directory: simulador-viajes
        run: npm test

  # ============================================================================
  # 2. CD - Build: Construcción de Imagen Docker ARM64 y Push a GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU (Soporte ARM64 para Oracle Ampere A1)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer Metadata de Docker (agrolink-ingesta)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Compilar y Publicar Imagen de agrolink-ingesta (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraer Metadata de Docker (rinho-receptor)
        id: meta-rinho-receptor
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.RINHO_RECEPTOR_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Compilar y Publicar Imagen de rinho-receptor (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./rinho-receptor
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-rinho-receptor.outputs.tags }}
          labels: ${{ steps.meta-rinho-receptor.outputs.labels }}
          cache-from: type=gha,scope=rinho-receptor
          cache-to: type=gha,mode=max,scope=rinho-receptor

  # ============================================================================
  # 2.1 CD - Build (manual): simulador-viajes NO es parte del stack de produccion.
  # Nunca se construye ni se publica en un push normal - solo con workflow_dispatch
  # marcando el input "deploy_simulador" (herramienta de demo/dev, feature 009).
  # ============================================================================
  build-and-push-simulador:
    name: Build & Push Docker Image (simulador-viajes)
    needs: test-simulador
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_simulador == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU (Soporte ARM64 para Oracle Ampere A1)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer Metadata de Docker (simulador-viajes)
        id: meta-simulador
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SIMULADOR_VIAJES_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Compilar y Publicar Imagen de simulador-viajes (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          # Contexto = raiz del repo (no simulador-viajes/): frameBuilder.js importa
          # rinho-receptor/test/tools/buildFrame.js por ruta relativa entre proyectos
          # (research.md D-01 de la feature 009), y la imagen necesita esos archivos.
          context: .
          file: simulador-viajes/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-simulador.outputs.tags }}
          labels: ${{ steps.meta-simulador.outputs.labels }}
          cache-from: type=gha,scope=simulador-viajes
          cache-to: type=gha,mode=max,scope=simulador-viajes

  # ============================================================================
  # 3. CD - Migrate & Deploy: Migraciones de esquema + Despliegue en OCI vía SSH
  # ============================================================================
  migrate-and-deploy:
    name: Migrate DB & Deploy to OCI Compute Instance
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar migraciones y scripts de deploy a la instancia de OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/migrations,deploy/scripts,deploy/compose.yaml"
          target: "/home/ubuntu/AgroLinkIngestaYAdapters"
          strip_components: 0

      - name: Ejecutar Migraciones y Despliegue en la Instancia de OCI
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: CR_PAT,GITHUB_ACTOR
          script: |
            set -e
            APP_DIR="/home/ubuntu/AgroLinkIngestaYAdapters"
            cd "$APP_DIR"

            echo "🗄️  Aplicando migraciones de esquema pendientes..."
            set -a
            source deploy/.env
            set +a
            chmod +x deploy/scripts/apply-migrations.sh
            if ! deploy/scripts/apply-migrations.sh deploy/compose.yaml deploy/migrations POSTGRES_DB; then
              echo "❌ Falló la aplicación de migraciones. El servicio en ejecución NO se toca."
              exit 1
            fi

            echo "🔑 Autenticando en GitHub Packages..."
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            wait_for_healthy() {
              local container="$1"
              local max_attempts=20
              local attempt=1
              local sleep_seconds=5

              until [ "$(docker inspect --format='{{.State.Health.Status}}' "$container" 2>/dev/null)" = "healthy" ]; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "❌ Error: $container no reportó 'healthy' tras $((max_attempts * sleep_seconds)) segundos."
                  echo "📋 Últimos logs del contenedor:"
                  docker logs --tail 80 "$container"
                  return 1
                fi
                echo "⏳ Esperando inicio de $container (intento $attempt/$max_attempts)..."
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
              done
            }

            echo "📦 Descargando la última versión de las imágenes (agrolink-ingesta, rinho-receptor)..."
            docker compose -f deploy/compose.yaml pull agrolink-ingesta rinho-receptor

            echo "🔄 Reiniciando agrolink-ingesta y rinho-receptor (sin afectar timescaledb)..."
            docker compose -f deploy/compose.yaml up -d --no-deps agrolink-ingesta rinho-receptor

            echo "🩺 Verificando estado de salud de agrolink-ingesta (healthcheck interno, sin puerto publicado)..."
            if ! wait_for_healthy agrolink-ingesta; then
              exit 1
            fi

            echo "🩺 Verificando estado de salud de rinho-receptor..."
            if ! wait_for_healthy rinho-receptor; then
              exit 1
            fi

            echo "🧹 Limpiando imágenes antiguas en desuso..."
            docker image prune -f

            echo "✅ Despliegue completado con éxito."

  # ============================================================================
  # 3.1 CD - Deploy (manual): levanta simulador-viajes en la VM. Nunca corre en un push
  # normal - solo con workflow_dispatch + input "deploy_simulador" (feature 009). Depende
  # de migrate-and-deploy para asegurarse de que el schema `simulador` (migracion 004) y
  # el rinho-receptor de esa VM ya estan al dia antes de conectar el simulador contra ellos.
  # ============================================================================
  deploy-simulador:
    name: Deploy simulador-viajes to OCI Compute Instance
    needs: [ build-and-push-simulador, migrate-and-deploy ]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_simulador == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar el seed del camión 1 de referencia a la instancia de OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/seed/simulador-camion-1.sql"
          target: "/home/ubuntu/AgroLinkIngestaYAdapters"
          strip_components: 0

      - name: Levantar simulador-viajes en la Instancia de OCI
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: CR_PAT,GITHUB_ACTOR
          script: |
            set -e
            APP_DIR="/home/ubuntu/AgroLinkIngestaYAdapters"
            cd "$APP_DIR"

            set -a
            source deploy/.env
            set +a

            echo "🔑 Autenticando en GitHub Packages..."
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "🌱 Cargando el camión 1 de referencia (idempotente, se omite si ya existe)..."
            docker compose -f deploy/compose.yaml exec -T timescaledb \
              psql -U postgres -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f - \
              < deploy/seed/simulador-camion-1.sql

            echo "📦 Descargando la última imagen de simulador-viajes..."
            docker compose -f deploy/compose.yaml --profile simulador pull simulador-viajes

            echo "🚚 Levantando simulador-viajes (apunta al rinho-receptor de esta misma VM)..."
            docker compose -f deploy/compose.yaml --profile simulador up -d --no-deps simulador-viajes

            echo "🩺 Verificando que el contenedor haya arrancado (sin healthcheck propio: es un cliente UDP/DB saliente)..."
            sleep 5
            if [ "$(docker inspect --format='{{.State.Running}}' simulador-viajes 2>/dev/null)" != "true" ]; then
              echo "❌ Error: simulador-viajes no quedó corriendo."
              echo "📋 Últimos logs del contenedor:"
              docker logs --tail 80 simulador-viajes
              exit 1
            fi

            echo "✅ simulador-viajes desplegado y corriendo."
