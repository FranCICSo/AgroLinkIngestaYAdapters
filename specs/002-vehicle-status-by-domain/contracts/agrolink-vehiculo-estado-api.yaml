openapi: 3.1.0

info:
  title: AgroLink Ingesta y Adaptación — API de Estado de Vehículo
  version: 1.0.0
  description: |
    Contrato HTTP de salida del servicio AgroLinkIngestaYAdaptacion (Spring Boot) para
    consultar el estado más reciente de un vehículo por su identificador de dispositivo
    IoT.

    El servicio es de **solo lectura**. AgroLinkBackend resuelve la patente del vehículo a
    su identificador de dispositivo (`Vehicle.iotDeviceId`) **antes** de invocar esta API:
    este servicio nunca conoce la patente ni llama a AgroLinkBackend (spec, Clarifications).

    A diferencia de `/api/v1/reportes/viaje` (interno, ver
    `../001-ingesta-adaptacion-telemetria/contracts/agrolink-reportes-api.yaml`), esta ruta
    se publica en un **puerto propio** hacia afuera del entorno de despliegue (FR-011).

    Feature: 002-vehicle-status-by-domain

servers:
  - url: http://localhost:${VEHICULO_ESTADO_HTTP_PORT}
    description: Puerto publicado al host, dedicado exclusivamente a esta API (research.md D-01)
    variables:
      VEHICULO_ESTADO_HTTP_PORT:
        default: '8082'

paths:
  /api/v1/vehiculos/{dispositivoId}/estado:
    get:
      summary: Estado más reciente de un vehículo (posición, CAN bus, dispositivo)
      description: |
        Devuelve un único objeto derivado de la lectura de telemetría con `momento_evento`
        más reciente para el identificador de dispositivo dado (FR-002, FR-006). No agrega
        ni promedia varias lecturas.

        **Semántica de "no encontrado" (FR-007/FR-008)**: en el alcance de esta feature no
        existe una entidad "vehículo" separada del dispositivo de telemetría (spec,
        Assumptions) — un identificador desconocido y un identificador sin lecturas
        registradas son el mismo caso y devuelven **404**, nunca un `200` con campos en
        `null`/cero que podría confundirse con una lectura real degradada.
      operationId: obtenerEstadoVehiculo
      parameters:
        - name: dispositivoId
          in: path
          required: true
          description: |
            Identificador de dispositivo IoT (equivalente a `Vehicle.iotDeviceId` en
            AgroLinkBackend y a `dispositivo_id` en telemetría). No es la patente: la
            resolución patente → identificador queda a cargo del llamador.
          schema:
            type: string
            minLength: 1
            maxLength: 20
          example: '2326'
      responses:
        '200':
          description: Estado más reciente conocido del vehículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoVehiculo'
              examples:
                lecturaCompleta:
                  summary: Lectura con fix GPS y datos CAN
                  value:
                    posicion:
                      latitud: -34.603722
                      longitud: -58.381592
                      velocidadKmh: 62.4
                      rumboGrados: 184
                    canBus:
                      odometroM: 184300
                      odometroOrigen: ECU
                      combustiblePct: 76.5
                      datosCanCrudos: { '1': '', '2': '', '3': '', 'B': '184.3', '14': '', '15': '76.5', '2A': '', '2C': '' }
                    dispositivo:
                      dispositivoId: '2326'
                      momentoEvento: '2026-09-09T18:42:10-03:00'
                      momentoRecepcion: '2026-09-09T18:42:11-03:00'
                      ignicion: true
                      tensionBateriaV: 13.2
                      satelites: 9
                      estadoInterpretacion: COMPLETA
                      camposFaltantes: []
                lecturaParcial:
                  summary: Lectura sin fix GPS (posición ausente, estado PARCIAL)
                  value:
                    posicion:
                      latitud: null
                      longitud: null
                      velocidadKmh: null
                      rumboGrados: null
                    canBus:
                      odometroM: 184300
                      odometroOrigen: ECU
                      combustiblePct: null
                      datosCanCrudos: {}
                    dispositivo:
                      dispositivoId: '2326'
                      momentoEvento: '2026-09-09T18:45:00-03:00'
                      momentoRecepcion: '2026-09-09T18:45:01-03:00'
                      ignicion: null
                      tensionBateriaV: null
                      satelites: 0
                      estadoInterpretacion: PARCIAL
                      camposFaltantes: ['latitud', 'longitud', 'combustible_pct']
        '400':
          description: El identificador de dispositivo está vacío o es inválido (FR-009).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'about:blank'
                title: 'Parámetro inválido'
                status: 400
                detail: "El identificador de dispositivo no puede estar vacío."
        '404':
          description: |
            No hay ninguna lectura de telemetría para ese identificador de dispositivo
            (FR-007/FR-008 — mismo caso, ver spec Assumptions).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'about:blank'
                title: 'Vehículo sin telemetría'
                status: 404
                detail: "No hay lecturas de telemetria para el dispositivo 'XYZ999'."
                dispositivoId: 'XYZ999'

components:
  schemas:

    EstadoVehiculo:
      type: object
      required: [posicion, canBus, dispositivo]
      properties:
        posicion:
          $ref: '#/components/schemas/Posicion'
        canBus:
          $ref: '#/components/schemas/CanBus'
        dispositivo:
          $ref: '#/components/schemas/DispositivoInfo'

    Posicion:
      type: object
      description: Nulo campo a campo cuando la lectura más reciente no tenía fix GPS.
      properties:
        latitud:
          type: [number, 'null']
          example: -34.603722
        longitud:
          type: [number, 'null']
          example: -58.381592
        velocidadKmh:
          type: [number, 'null']
          example: 62.4
        rumboGrados:
          type: [integer, 'null']
          example: 184

    CanBus:
      type: object
      properties:
        odometroM:
          type: [integer, 'null']
          description: Odómetro en metros, cualquiera sea su origen (ver `odometroOrigen`).
          example: 184300
        odometroOrigen:
          type: [string, 'null']
          enum: [ECU, GPS, null]
        combustiblePct:
          type: [number, 'null']
          example: 76.5
        datosCanCrudos:
          type: object
          description: |
            Datos CAN tal como los persistió el receptor (`datos_can`), sin reinterpretar
            (spec, Assumptions). Objeto vacío si la lectura no trajo ningún dato CAN.
          additionalProperties: true

    DispositivoInfo:
      type: object
      required: [dispositivoId, momentoEvento, momentoRecepcion, estadoInterpretacion, camposFaltantes]
      properties:
        dispositivoId:
          type: string
          example: '2326'
        momentoEvento:
          type: string
          format: date-time
          description: Cuándo ocurrió el evento según el dispositivo (criterio de "más reciente", FR-006).
        momentoRecepcion:
          type: string
          format: date-time
          description: Cuándo llegó la lectura al servidor.
        ignicion:
          type: [boolean, 'null']
        tensionBateriaV:
          type: [number, 'null']
          example: 13.2
        satelites:
          type: [integer, 'null']
          example: 9
        estadoInterpretacion:
          type: string
          enum: [COMPLETA, PARCIAL]
        camposFaltantes:
          type: array
          items:
            type: string

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        dispositivoId:
          type: string
